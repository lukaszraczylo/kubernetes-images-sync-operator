name: Release

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "config/samples/**"
    branches:
      - main

permissions:
  id-token: write
  contents: write
  packages: write
  deployments: write

jobs:
  release:
    uses: lukaszraczylo/shared-actions/.github/workflows/go-release.yaml@main
    with:
      go-version: "1.22"
      docker-enabled: true
    secrets: inherit

  build-worker-image:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get release version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker-image-worker
          file: ./docker-image-worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lukaszraczylo/kubernetes-images-sync-worker:${{ steps.version.outputs.version }}
            ghcr.io/lukaszraczylo/kubernetes-images-sync-worker:latest

  publish-helm-chart:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get release version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Trigger helm-charts release
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh api repos/lukaszraczylo/helm-charts/dispatches \
            -f event_type=release-chart \
            -f client_payload[chart_name]=kube-images-sync \
            -f client_payload[version]=${{ steps.version.outputs.version }} \
            -f client_payload[source_repo]=lukaszraczylo/kubernetes-images-sync-operator \
            -f client_payload[chart_path]=charts/kube-images-sync-operator
